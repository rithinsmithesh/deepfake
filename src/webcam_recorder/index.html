<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepShield Live Video Call Recorder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", sans-serif;
    }
    body {
      background: transparent;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      overflow: hidden;
    }
    .recorder-container {
      width: 100%;
      max-width: 680px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      position: relative;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .title-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #38bdf8;
    }
    .status-badge {
      font-size: 0.75rem;
      font-family: monospace;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge.recording {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.4);
      animation: pulse 1.2s infinite;
    }
    .video-viewport {
      position: relative;
      width: 100%;
      height: 380px;
      background: #070a12;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video#preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* mirror preview */
    }
    /* HUD Corner Marks */
    .hud-corner {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid #38bdf8;
      pointer-events: none;
      z-index: 5;
    }
    .tl { top: 12px; left: 12px; border-right: none; border-bottom: none; }
    .tr { top: 12px; right: 12px; border-left: none; border-bottom: none; }
    .bl { bottom: 12px; left: 12px; border-right: none; border-top: none; }
    .br { bottom: 12px; right: 12px; border-left: none; border-top: none; }

    /* Face Target Oval */
    .face-target {
      position: absolute;
      width: 200px;
      height: 260px;
      border: 1.5px dashed rgba(56, 189, 248, 0.4);
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
    }
    .face-target-text {
      position: absolute;
      bottom: 24px;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.6);
      font-family: monospace;
      text-transform: uppercase;
      z-index: 5;
      background: rgba(0, 0, 0, 0.5);
      padding: 3px 8px;
      border-radius: 4px;
    }

    /* Audio Meter Bar */
    .audio-meter-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      margin-top: 10px;
      overflow: hidden;
      display: flex;
    }
    .audio-meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444);
      transition: width 0.08s ease;
      border-radius: 3px;
    }

    /* Controls Bar - Stacked for Mobile & Desktop */
    .controls-wrapper {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    .controls-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
    }
    .duration-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #94a3b8;
      flex: 1 1 auto;
    }
    .duration-selector select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      width: 100%;
      max-width: 220px;
    }
    .timer-display {
      font-family: monospace;
      font-size: 1.25rem;
      font-weight: 700;
      color: #38bdf8;
      min-width: 85px;
      text-align: right;
    }
    .btn {
      padding: 13px 20px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      width: 100%;
      box-sizing: border-box;
    }
    .btn-record {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
    }
    .btn-record:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
    }
    .btn-stop {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0f172a;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
    }
    .btn-stop:hover {
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
    }
    .info-msg {
      margin-top: 10px;
      font-size: 0.78rem;
      color: #94a3b8;
      text-align: center;
      font-family: monospace;
      line-height: 1.4;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    @media (max-width: 540px) {
      body {
        padding: 4px;
      }
      .recorder-container {
        padding: 12px;
        border-radius: 10px;
      }
      .video-viewport {
        height: 250px;
      }
      .face-target {
        width: 140px;
        height: 190px;
      }
      .duration-selector select {
        max-width: 160px;
        font-size: 0.8rem;
      }
      .timer-display {
        font-size: 1.1rem;
      }
      .btn {
        padding: 12px 16px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="recorder-container" id="container">
    <div class="top-bar">
      <div class="title-tag">
        <span>🛡️</span>
        <span>LIVE VIDEO CALL RECORDER</span>
      </div>
      <div class="status-badge" id="statusBadge">
        <span style="font-size: 0.9rem;">●</span>
        <span id="statusText">STANDBY</span>
      </div>
    </div>

    <div class="video-viewport">
      <video id="preview" autoplay playsinline muted></video>
      <div class="hud-corner tl"></div>
      <div class="hud-corner tr"></div>
      <div class="hud-corner bl"></div>
      <div class="hud-corner br"></div>
      <div class="face-target"></div>
      <div class="face-target-text">Position Face In Center</div>
    </div>

    <!-- Live Audio Volume Meter -->
    <div class="audio-meter-container" title="Live Microphone Volume">
      <div class="audio-meter-fill" id="audioFill"></div>
    </div>

    <div class="controls-wrapper">
      <div class="controls-top-row">
        <div class="duration-selector">
          <label for="durationSelect">Capture:</label>
          <select id="durationSelect">
            <option value="5">5 Seconds (Fast)</option>
            <option value="8" selected>8 Seconds (Recommended)</option>
            <option value="12">12 Seconds (Extended)</option>
            <option value="0">Manual Start/Stop</option>
          </select>
        </div>
        <div class="timer-display" id="timerDisplay">00:00.0</div>
      </div>

      <button class="btn btn-record" id="recordBtn">
        <span style="font-size: 1.1rem;">🔴</span>
        <span id="btnLabel">START RECORDING CALL</span>
      </button>
    </div>

    <div class="info-msg" id="infoMsg">
      Simulate live video call speech • Video and audio will be analyzed for deepfake synthesis
    </div>
  </div>

  <script>
    // Streamlit Component Protocol Handlers
    function sendValueToStreamlit(value) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: value
      }, "*");
    }

    function setFrameHeight() {
      const container = document.getElementById("container");
      const height = container ? Math.max(container.scrollHeight + 35, 490) : 520;
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: height
      }, "*");
    }

    function notifyReady() {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:componentReady",
        apiVersion: 1
      }, "*");
    }

    // Media & Recording State
    let mediaStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let startTime = null;
    let timerInterval = null;
    let autoStopTimeout = null;
    let audioContext = null;
    let audioAnalyser = null;
    let audioSource = null;
    let animFrameId = null;

    const videoElem = document.getElementById("preview");
    const recordBtn = document.getElementById("recordBtn");
    const btnLabel = document.getElementById("btnLabel");
    const statusBadge = document.getElementById("statusBadge");
    const statusText = document.getElementById("statusText");
    const timerDisplay = document.getElementById("timerDisplay");
    const durationSelect = document.getElementById("durationSelect");
    const audioFill = document.getElementById("audioFill");
    const infoMsg = document.getElementById("infoMsg");

    async function initCamera() {
      try {
        statusText.innerText = "REQUESTING ACCESS...";
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 640 },
            height: { ideal: 480 },
            facingMode: "user"
          },
          audio: {
            echoCancellation: true,
            noiseSuppression: true
          }
        });

        videoElem.srcObject = mediaStream;
        statusText.innerText = "LIVE CAMERA READY";
        statusBadge.classList.remove("recording");
        infoMsg.innerText = "✓ Camera & Microphone connected. Click 'RECORD CALL' and speak clearly.";

        initAudioMeter(mediaStream);
        setFrameHeight();
      } catch (err) {
        console.error("Camera access error:", err);
        statusText.innerText = "ACCESS DENIED";
        statusBadge.style.borderColor = "#ef4444";
        statusBadge.style.color = "#ef4444";
        infoMsg.innerText = "⚠️ Camera/Mic permission denied or not available. Check browser permissions.";
        setFrameHeight();
      }
    }

    function initAudioMeter(stream) {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;

        audioContext = new AudioContextClass();
        const audioTracks = stream.getAudioTracks();
        if (audioTracks.length === 0) return;

        audioAnalyser = audioContext.createAnalyser();
        audioAnalyser.fftSize = 64;
        audioSource = audioContext.createMediaStreamSource(stream);
        audioSource.connect(audioAnalyser);

        const dataArray = new Uint8Array(audioAnalyser.frequencyBinCount);

        function updateMeter() {
          if (!audioAnalyser) return;
          audioAnalyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) {
            sum += dataArray[i];
          }
          const avg = sum / dataArray.length;
          const pct = Math.min(100, Math.round((avg / 128) * 100));
          audioFill.style.width = pct + "%";
          animFrameId = requestAnimationFrame(updateMeter);
        }
        updateMeter();
      } catch (e) {
        console.warn("Audio meter init error:", e);
      }
    }

    function getSupportedMimeType() {
      const types = [
        "video/webm;codecs=vp8,opus",
        "video/webm;codecs=vp9,opus",
        "video/webm",
        "video/mp4;codecs=avc1,mp4a.40.2",
        "video/mp4"
      ];
      for (const t of types) {
        if (MediaRecorder.isTypeSupported(t)) {
          return t;
        }
      }
      return "";
    }

    function startRecording() {
      if (!mediaStream) {
        alert("Camera stream is not active. Please grant camera/mic permissions.");
        return;
      }

      recordedChunks = [];
      const mimeType = getSupportedMimeType();
      const options = mimeType ? { mimeType } : {};

      try {
        mediaRecorder = new MediaRecorder(mediaStream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(mediaStream);
      }

      mediaRecorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0) {
          recordedChunks.push(event.data);
        }
      };

      mediaRecorder.onstop = () => {
        finishRecording(mimeType);
      };

      mediaRecorder.start(200); // 200ms timeslices
      isRecording = true;
      startTime = Date.now();

      // UI update
      statusText.innerText = "RECORDING CALL...";
      statusBadge.classList.add("recording");
      recordBtn.classList.remove("btn-record");
      recordBtn.classList.add("btn-stop");
      btnLabel.innerText = "⏹️ STOP RECORDING NOW";
      infoMsg.innerText = "🔴 Live call capturing in progress... Speak naturally.";

      timerInterval = setInterval(updateTimer, 100);

      const targetDurationSec = parseFloat(durationSelect.value);
      if (targetDurationSec > 0) {
        autoStopTimeout = setTimeout(() => {
          if (isRecording) {
            stopRecording();
          }
        }, targetDurationSec * 1000);
      }
    }

    function stopRecording() {
      if (!isRecording || !mediaRecorder) return;
      isRecording = false;

      if (autoStopTimeout) clearTimeout(autoStopTimeout);
      if (timerInterval) clearInterval(timerInterval);

      mediaRecorder.stop();

      // UI update
      statusText.innerText = "PROCESSING VIDEO...";
      statusBadge.classList.remove("recording");
      recordBtn.classList.remove("btn-stop");
      recordBtn.classList.add("btn-record");
      btnLabel.innerText = "🔄 RECORD AGAIN";
      infoMsg.innerText = "⏳ Encoding live call container and sending to DeepShield forensic pipeline...";
    }

    function updateTimer() {
      if (!startTime) return;
      const elapsedMs = Date.now() - startTime;
      const totalSec = elapsedMs / 1000;
      const mins = Math.floor(totalSec / 60);
      const secs = Math.floor(totalSec % 60);
      const tenths = Math.floor((elapsedMs % 1000) / 100);
      timerDisplay.innerText = 
        String(mins).padStart(2, "0") + ":" + 
        String(secs).padStart(2, "0") + "." + 
        tenths;
    }

    function finishRecording(chosenMime) {
      const blob = new Blob(recordedChunks, { type: chosenMime || "video/webm" });
      const durationSec = startTime ? (Date.now() - startTime) / 1000 : 0;

      const reader = new FileReader();
      reader.onloadend = () => {
        const base64Data = reader.result;
        statusText.innerText = "SENT FOR FORENSIC ANALYSIS";
        infoMsg.innerText = `✓ Captured ${durationSec.toFixed(1)}s call segment (${(blob.size/1024).toFixed(1)} KB). Running spatial CNN and audio-lip sync...`;

        sendValueToStreamlit({
          base64: base64Data,
          size_bytes: blob.size,
          duration_sec: durationSec,
          mime_type: chosenMime || "video/webm",
          timestamp: Date.now()
        });
      };
      reader.readAsDataURL(blob);
    }

    recordBtn.addEventListener("click", () => {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    });

    // Handle render messages from Streamlit
    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "streamlit:render") {
        setFrameHeight();
      }
    });

    // Startup
    window.addEventListener("load", () => {
      notifyReady();
      setFrameHeight();
      initCamera();
    });
  </script>
</body>
</html>
